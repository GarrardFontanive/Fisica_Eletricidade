<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Simulador: Circuito Elétrico Macroscópico</title>
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #1a1a2e;
    font-family: Arial, sans-serif;
    color: white;
}
#sim-canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
.ui-layer {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    display: flex;
    gap: 20px;
}
.glass-panel {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    width: 300px;
}
h3 {
    margin-top: 0;
    text-transform: uppercase;
    font-size: 14px;
    letter-spacing: 1px;
}
input[type=range] {
    width: 100%;
    margin-bottom: 15px;
    accent-color: #e94560;
}
button {
    background: #e94560;
    color: white;
    border: none;
    padding: 10px;
    cursor: pointer;
    border-radius: 5px;
    width: 100%;
    margin-bottom: 15px;
    font-weight: bold;
    transition: 0.3s;
}
button.btn-green { background: #43a047; }
button:hover { filter: brightness(1.2); }

.data-row {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 5px;
    font-size: 14px;
}
.label-slider {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
}
</style>
</head>
<body>
<div class="ui-layer">
    <div class="glass-panel">
        <h3>Controle do Circuito</h3>

        <button id="btn-switch" class="btn-green">Ligar Circuito (Fechar)</button>

        <label class="label-slider" for="ddp-slider">DDP da Bateria (V): <span id="ddp-val">12 V</span></label>
        <input type="range" id="ddp-slider" min="0" max="24" value="12">

        <div class="data-row"><span>Resistência da Lâmpada:</span><span>10 Ω</span></div>
        <div class="data-row"><span>Corrente (i):</span><span id="current-val">0.00 A</span></div>
        <div class="data-row"><span>Potência (Luminosidade):</span><span id="power-val">0.00 W</span></div>
    </div>
</div>

<canvas id="sim-canvas"></canvas>

<script src="app.js"></script>
</body>
</html>
